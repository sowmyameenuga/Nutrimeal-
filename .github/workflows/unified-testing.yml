name: Unified E2E Testing & Verification Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── 1. Selenium E2E Web Tests ──────────────────────────────────────────────
  selenium-web-tests:
    name: 🌐 Selenium Web E2E (Unit, Security, Functional)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🌐 Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 📦 Install Dependencies
        working-directory: ./e2e_tests
        run: npm install

      - name: 🚀 Run Selenium E2E Test Suite (>400 Tests)
        working-directory: ./e2e_tests
        env:
          GITHUB_PAGES_URL: ${{ secrets.GITHUB_PAGES_URL || 'https://sowmyameenuga.github.io/Nutrimeal-/' }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://nutrimeal-backend-qjqa.onrender.com' }}
        run: npm test

      - name: 📤 Upload Web Selenium Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: web-selenium-report
          path: ./e2e_tests/Test_Report.xlsx
          retention-days: 7

      - name: 📊 Write Summary to GHA Summary
        if: always()
        run: |
          echo "### 🌐 Selenium Web E2E Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "./e2e_tests/test-summary.json" ]; then
            TOTAL=$(jq '.total' ./e2e_tests/test-summary.json)
            PASSED=$(jq '.passed' ./e2e_tests/test-summary.json)
            FAILED=$(jq '.failed' ./e2e_tests/test-summary.json)
            echo "- **Total Tests Run**: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Passed**: 🟢 $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed**: 🔴 $FAILED" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Could not locate test-summary.json." >> $GITHUB_STEP_SUMMARY
          fi

  # ── 2. Appium Android E2E Tests ─────────────────────────────────────────────
  appium-android-tests:
    name: 📱 Android Appium E2E (1,111 Tests)
    runs-on: macos-13
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Build Debug APK
        run: flutter build apk --debug --target-platform android-x64
        working-directory: ${{ github.workspace }}

      - name: Set APK_PATH env var
        run: |
          APK="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-debug.apk"
          echo "APK_PATH=${APK}" >> $GITHUB_ENV
          echo "APK located at: ${APK}"
          ls -lh "${APK}"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & WDIO dependencies
        working-directory: ${{ github.workspace }}/NutrimealAppium
        run: |
          npm ci --prefer-offline || npm install
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: Skip KVM (macOS natively accelerated)
        run: echo "macOS runner provides native hardware acceleration for Android Emulators."

      - name: Make CI script executable
        run: chmod +x ${{ github.workspace }}/NutrimealAppium/scripts/ci_run_tests.sh

      - name: Run Appium Tests on Android Emulator (API 29 · Nexus 6)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ env.APK_PATH }}
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          avd-name: Nutrimeal_E2E_AVD
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-boot-anim
          script: bash ./NutrimealAppium/scripts/ci_run_tests.sh

      - name: 📤 Upload Android Appium Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-appium-report
          path: ${{ github.workspace }}/NutrimealAppium/Test_Results/nutrimeal-appium-e2e-report.xlsx
          retention-days: 7

  # ── 3. Vulnerability & Security Scans ───────────────────────────────────────
  vulnerability-scans:
    name: 🛡️ Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./NutrimealE2E
        run: npm install exceljs

      - name: Run Web Security Suite
        run: |
          node NutrimealE2E/scripts/generateWebSecuritySuite.js
          echo "### 🛡️ Web Security Scan" >> $GITHUB_STEP_SUMMARY
          cat NutrimealE2E/web-executive-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Run Backend Security Suite
        env:
          NODE_PATH: ${{ github.workspace }}/NutrimealE2E/node_modules
        run: |
          node backend/scripts/generateSecuritySuite.js
          echo "### 🛡️ Backend Security Scan" >> $GITHUB_STEP_SUMMARY
          cat backend/executive-summary.md >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Security Findings
        uses: actions/upload-artifact@v4
        with:
          name: security-scans-report
          path: |
            NutrimealE2E/web-security-findings.xlsx
            backend/findings.xlsx
          retention-days: 7

  # ── 4. API Load Testing ────────────────────────────────────────────────────
  api-load-testing:
    name: ⚡ API Load Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        run: |
          k6 run --summary-export=backend/summary.json backend/scripts/load-test.js
        env:
          BACKEND_URL: 'https://nutrimeal-backend-qjqa.onrender.com/api/health'

      - name: Install ExcelJS for Load Test Reporting
        working-directory: ./NutrimealE2E
        run: npm install exceljs

      - name: Generate Load Test Excel Report
        env:
          NODE_PATH: ${{ github.workspace }}/NutrimealE2E/node_modules
        run: |
          node backend/scripts/generateLoadTestExcel.js

      - name: Parse and Publish Metrics
        working-directory: ./backend
        run: |
          node scripts/parseK6Summary.js

      - name: 📤 Upload Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: backend/load-test-report.xlsx
          retention-days: 7

  # ── 5. Package Reports in single ZIP ───────────────────────────────────────
  package-reports:
    name: 📦 Package All Excel Reports in ZIP
    runs-on: ubuntu-latest
    needs: [selenium-web-tests, appium-android-tests, vulnerability-scans, api-load-testing]
    if: always()
    steps:
      - name: 📥 Download Web Selenium Report
        uses: actions/download-artifact@v4
        with:
          name: web-selenium-report
          path: ./reports/web-selenium
        continue-on-error: true

      - name: 📥 Download Android Appium Report
        uses: actions/download-artifact@v4
        with:
          name: android-appium-report
          path: ./reports/android-appium
        continue-on-error: true

      - name: 📥 Download Security Scan Report
        uses: actions/download-artifact@v4
        with:
          name: security-scans-report
          path: ./reports/security-scans
        continue-on-error: true

      - name: 📥 Download Load Test Report
        uses: actions/download-artifact@v4
        with:
          name: load-test-report
          path: ./reports/load-test
        continue-on-error: true

      - name: 📦 Compile Excel Reports & Zip
        run: |
          mkdir -p ./all-excel-reports
          find ./reports -name "*.xlsx" -exec cp {} ./all-excel-reports/ \;
          echo "Collected Excel files:"
          ls -la ./all-excel-reports
          zip -j Nutrimeal-All-Testing-Reports.zip ./all-excel-reports/*.xlsx

      - name: 📤 Upload Final ZIP Report Archive
        uses: actions/upload-artifact@v4
        with:
          name: Nutrimeal-All-Testing-Reports
          path: Nutrimeal-All-Testing-Reports.zip
          retention-days: 14
